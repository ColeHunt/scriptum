# SSH client settings for the Scriptum head in fleet mode (decision 048).
# Mounted read-only at /etc/ssh/ssh_config.d/scriptum-fleet.conf in the head's
# container, so both `docker` (DOCKER_HOST=ssh://root@<worker>) and the
# readiness probe pick it up whatever uid the container runs as.
#
# Workers live only on the private VPC and their firewall admits only the
# head, and every scale-up is a fresh droplet (new host key, often a reused
# IP), so host-key pinning would only break scale-ups; it is off for the VPC
# range and nowhere else.
Host 10.*
    IdentityFile /etc/scriptum-fleet/id_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    LogLevel ERROR
    # Every docker CLI call is its own ssh session; share one connection per
    # worker instead of a full handshake on each status poll.
    ControlMaster auto
    ControlPath /tmp/ssh-%C
    ControlPersist 5m
    ServerAliveInterval 15
    ServerAliveCountMax 3
